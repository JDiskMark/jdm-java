# JDiskMark logging configuration
# Loaded at startup by App.init() via LogManager.readConfiguration().
#
# The root handler writes WARNING+ to the console (stderr).
# Hibernate emits many INFO messages during startup (version banner,
# connection pool init, DDL, etc.) that are noise for end users.
# Set org.hibernate to WARNING to suppress them while leaving
# application-level WARNING/SEVERE messages visible.
handlers=java.util.logging.ConsoleHandler
.level=WARNING
java.util.logging.ConsoleHandler.level=WARNING
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# Suppress Hibernate INFO startup chatter
org.hibernate.level=WARNING
