name: Linux RPM Build

on:
  push:
    branches: [ "dev", "release/**" ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      disable_ci_label:
        description: 'Skip CI pre-release label and pass POM version through unchanged'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-linux-rpm:
    runs-on: ubuntu-latest
    # Run inside a Fedora container so rpmbuild, macros, and spec behaviour
    # match a native RPM platform. Building RPMs inside Ubuntu/Debian runners
    # uses a foreign rpmbuild whose macro paths, defaults, and shell behaviour
    # differ enough to break spec %install sections that work on Fedora.
    container: fedora:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install rpm-build and Maven
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build \
            maven \
            findutils \
            which
          rpmbuild --version
          mvn --version

      - name: Set up JDK 25
        # setup-java works inside containers; it downloads Temurin directly.
        # Fedora's own repos may not yet ship java-25-openjdk-devel, so we
        # use Temurin to guarantee the same JDK version as the DEB builds.
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compute CI version
        id: ver
        uses: ./.github/actions/ci-version
        with:
          disable_ci_label: ${{ inputs.disable_ci_label || false }}

      - name: Build RPM Package
        # Explicitly activating the linux-rpm profile to ensure jpackage runs.
        run: |
          mvn clean install -pl jdm-core,jdm-dist/jdm-rpm -am -Plinux-rpm \
            -Drevision=${{ steps.ver.outputs.install_version }} \
            -Ddisplay.version=${{ steps.ver.outputs.display_version }} \
            -Drpm.version=${{ steps.ver.outputs.rpm_version }} \
            --no-transfer-progress

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: jdiskmark-rpm-pkg
          path: jdm-dist/jdm-rpm/target/*.rpm
          if-no-files-found: error
          # Disable zipping so it can be downloaded raw from the Actions tab
          archive: false
