name: Linux Flatpak Build

on:
  push:
    branches: [ "dev", "release/**" ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      disable_ci_label:
        description: 'Skip CI pre-release label and pass POM version through unchanged'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    # The image tag must track runtime-version in jdm-dist/jdm-flatpak/net.jdiskmark.JDiskMark.yml
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'oracle'
        cache: maven

    - name: Install Maven
      run: |
        mkdir -p /opt
        curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz | tar -xz -C /opt
        echo "/opt/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"

    - name: Compute CI version
      id: ver
      uses: ./.github/actions/ci-version
      with:
        disable_ci_label: ${{ inputs.disable_ci_label || false }}

    - name: Build Flatpak Bundle
      # Explicitly activating the linux-flatpak profile to ensure jpackage/antrun runs.
      # The container has the runtime/SDK installed system-wide, so build against that, not a --user install.
      run: |
        mvn clean install -pl jdm-core,jdm-dist/jdm-flatpak -am -Plinux-flatpak \
          "-Dflatpak.builder.opts=--system --disable-rofiles-fuse" \
          -Drevision=${{ steps.ver.outputs.install_version }} \
          -Ddisplay.version=${{ steps.ver.outputs.display_version }} \
          --no-transfer-progress

    - name: Upload Flatpak Artifact
      uses: actions/upload-artifact@v7
      with:
        name: flatpak-package
        path: jdm-dist/jdm-flatpak/target/*.flatpak
        if-no-files-found: error
        # Disable zipping so it can be downloaded raw from the Actions tab
        archive: false
