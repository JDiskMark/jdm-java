name: Windows MSI Build

on:
  push:
    branches: [ "dev", "release/**" ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      disable_ci_label:
        description: 'Skip CI pre-release label and pass POM version through unchanged'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-msi:
    runs-on: windows-latest  # Windows runner auto-activates the windows-msi Maven profile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compute CI version
        id: ver
        uses: ./.github/actions/ci-version
        with:
          disable_ci_label: ${{ inputs.disable_ci_label || false }}

      - name: Build Windows MSI (unsigned)
        # Builds jdm-core first (-am = also build upstream dependencies),
        # then jdm-msi. Explicitly activating the windows-msi profile.
        # msi.version must remain purely numeric (Major.Minor.Build) — pass
        # base_version to satisfy the WiX/MSI format constraint.
        shell: bash
        run: |
          mvn clean install -pl jdm-core,jdm-dist/jdm-msi -am -Pwindows-msi \
            -Drevision=${{ steps.ver.outputs.install_version }} \
            -Ddisplay.version=${{ steps.ver.outputs.display_version }} \
            -Dmsi.version=${{ steps.ver.outputs.msi_version }} \
            --no-transfer-progress

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: jdiskmark-windows-msi
          path: jdm-dist/jdm-msi/target/*.msi
          if-no-files-found: error
          # Disable zipping so it can be downloaded raw from the Actions tab
          archive: false

      - name: Smoke test — install MSI and verify SMART assets
        shell: pwsh
        run: |
          # Silent install — /qn = no UI, /norestart avoids reboot prompts
          $msi = (Get-ChildItem jdm-dist/jdm-msi/target/*.msi).FullName
          Write-Host "Installing: $msi"
          Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -NoNewWindow

          # jpackage installs to "C:\Program Files\<name>\", where <name> is
          # the --name arg: "JDiskMark <version>". Find it dynamically.
          $installDir = Get-ChildItem "C:\Program Files" -Directory | Where-Object { $_.Name -like "JDiskMark*" } | Select-Object -First 1
          if (-not $installDir) { throw "JDiskMark install directory not found under C:\Program Files" }
          Write-Host "Install dir: $($installDir.FullName)"

          # Verify the main launcher exists and runs
          $launcher = Join-Path $installDir.FullName "JDiskMark*.exe" | Get-ChildItem | Select-Object -First 1
          if (-not $launcher) { throw "Launcher executable not found" }
          Write-Host "Launcher: $($launcher.FullName)"

          # Verify bundled smartctl was packaged correctly
          $smartctl = Join-Path $installDir.FullName "app\smartctl\smartctl.exe"
          if (-not (Test-Path $smartctl)) { throw "smartctl.exe not found at: $smartctl" }
          & $smartctl --version
          Write-Host "SMART assets verified OK"
